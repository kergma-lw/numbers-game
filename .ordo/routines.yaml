version: 1
routines:
  review.render-open-diff:
    kind: probe
    summary: Render the current branch diff versus main into a temporary HTML file
      and try to open it locally.
    args:
      issue_number:
        type: string
        required: true
    implementation:
      argv:
      - ".ordo/scripts/render-review-diff.py"
      - "{issue_number}"
    outputs:
      mode: data
      format: json
    failure_modes:
    - diff_render_failed
    - viewer_launch_failed
    - runtime_unavailable
  verify.run-all-tests:
    kind: action
    summary: Run the complete Flutter test suite.
    implementation:
      argv:
      - ".ordo/scripts/run-all-tests.sh"
    failure_modes:
    - tests_failed
    - runtime_unavailable
