# Keep Android builds from retaining background processes after they finish.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process

# This small project does not need the template's 8 GB Gradle heap.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
