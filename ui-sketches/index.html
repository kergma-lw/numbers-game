<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Numbers Game — start screen sketch</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4eddf;
        --muted: #bcb6aa;
        --night: #131a2a;
        --panel: rgba(28, 38, 58, 0.84);
        --panel-light: rgba(48, 62, 88, 0.92);
        --line: rgba(237, 224, 191, 0.18);
        --gold: #f4b94c;
        --coral: #ec765d;
        --aqua: #74d7c4;
      }

      * { box-sizing: border-box; }

      body {
        align-items: center;
        background:
          radial-gradient(ellipse at 17% 18%, rgba(116, 215, 196, 0.2), transparent 27rem),
          radial-gradient(ellipse at 82% 76%, rgba(236, 118, 93, 0.18), transparent 25rem),
          radial-gradient(ellipse at 48% 52%, #273356 0%, transparent 38rem),
          var(--night);
        display: flex;
        font-family: Georgia, "Times New Roman", serif;
        justify-content: center;
        isolation: isolate;
        margin: 0;
        min-height: 100svh;
        overflow-x: hidden;
      }

      .numbers {
        color: rgba(244, 237, 223, 0.075);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(8rem, 19vw, 17rem);
        font-weight: 700;
        letter-spacing: -0.12em;
        line-height: 0.72;
        pointer-events: none;
        position: fixed;
        transform: rotate(-11deg) skewY(-7deg);
        user-select: none;
        z-index: -1;
      }

      .numbers.top { left: -0.5rem; top: 4rem; }
      .numbers.bottom { bottom: 2rem; right: 4rem; transform: rotate(9deg) skewY(7deg); }

      .background-lens {
        --lens-duration: 32s;
        background:
          radial-gradient(ellipse at 17% 18%, rgba(116, 215, 196, 0.2), transparent 32rem),
          radial-gradient(ellipse at 82% 76%, rgba(236, 118, 93, 0.18), transparent 30rem),
          radial-gradient(ellipse at 48% 52%, #273356 0%, transparent 45rem),
          #131a2a;
        background-attachment: fixed;
        border-radius: 50%;
        height: 13rem;
        left: 18vw;
        mask-image: radial-gradient(circle, #000 43%, rgba(0, 0, 0, 0.48) 67%, transparent 82%);
        opacity: 0.62;
        pointer-events: none;
        position: fixed;
        top: 16vh;
        transition: left var(--lens-duration) cubic-bezier(0.42, 0, 0.25, 1), top var(--lens-duration) cubic-bezier(0.42, 0, 0.25, 1);
        width: 13rem;
        z-index: -1;
      }

      .lens-number {
        color: rgba(244, 237, 223, 0.075);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(8rem, 19vw, 17rem);
        font-weight: 700;
        letter-spacing: -0.12em;
        line-height: 0.72;
        position: fixed;
        transform: scale(1.18) rotate(-11deg) skewY(-7deg);
        transform-origin: center;
        user-select: none;
        white-space: nowrap;
      }

      .lens-number.top { left: -0.5rem; top: 4rem; }
      .lens-number.bottom { bottom: 2rem; right: 4rem; transform: scale(1.18) rotate(9deg) skewY(7deg); }

      .equation {
        color: rgba(116, 215, 196, 0.19);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(1.1rem, 2.6vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        pointer-events: none;
        position: fixed;
        user-select: none;
        z-index: -1;
      }

      .equation.left { left: 9vw; top: 70%; transform: rotate(-18deg); }
      .equation.right { color: rgba(236, 118, 93, 0.2); right: 8vw; top: 15%; transform: rotate(13deg); }

      .orb {
        background: radial-gradient(circle at 33% 25%, rgba(255, 255, 255, 0.34), rgba(116, 215, 196, 0.16) 30%, rgba(19, 26, 42, 0.08) 68%);
        border: 1px solid rgba(116, 215, 196, 0.2);
        border-radius: 47% 53% 51% 49% / 48% 43% 57% 52%;
        box-shadow: inset -0.5rem -0.7rem 1.4rem rgba(3, 10, 25, 0.22), 0 0 3rem rgba(116, 215, 196, 0.08);
        height: 8rem;
        pointer-events: none;
        position: fixed;
        right: -2.5rem;
        top: 42%;
        transform: rotate(-16deg);
        width: 8rem;
        z-index: -1;
      }

      main {
        display: grid;
        gap: 1.25rem;
        margin: 2.5rem 1.25rem;
        max-width: 37rem;
        width: 100%;
      }

      .masthead { padding: 0 1rem; text-align: center; }

      .eyebrow {
        color: var(--aqua);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.19em;
        margin: 0 0 0.55rem;
        text-transform: uppercase;
      }

      h1 {
        color: var(--ink);
        font-size: clamp(3rem, 10vw, 5.1rem);
        letter-spacing: 0.055em;
        line-height: 0.82;
        margin: 0;
        text-shadow: 0 0.15rem 0 rgba(0, 0, 0, 0.28), 0 0 2rem rgba(244, 237, 223, 0.08);
      }

      .tagline { color: var(--muted); font-size: 1rem; margin: 0.9rem 0 0; }

      .panel {
        backdrop-filter: blur(12px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1.4rem;
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.24);
        padding: 1.2rem;
        position: relative;
        overflow: hidden;
      }

      .panel::before {
        border: 1px solid rgba(244, 185, 76, 0.22);
        border-radius: 50%;
        content: "";
        height: 1.2rem;
        position: absolute;
        right: 0.85rem;
        top: 0.65rem;
        width: 1.2rem;
      }

      .panel > * { position: relative; z-index: 1; }

      .meteor {
        --meteor-angle: -28deg;
        --meteor-end-x: 49rem;
        --meteor-end-y: 14rem;
        --meteor-left: -8rem;
        --meteor-top: 55%;
        background: linear-gradient(90deg, transparent, rgba(244, 237, 223, 0.12) 18%, rgba(244, 185, 76, 0.88) 55%, transparent 100%);
        box-shadow: 0 0 0.5rem rgba(244, 185, 76, 0.4);
        height: 2px;
        left: var(--meteor-left);
        opacity: 0;
        pointer-events: none;
        position: absolute;
        top: var(--meteor-top);
        transform: rotate(-28deg);
        width: 8rem;
        z-index: 0;
      }

      .meteor::after {
        background: #fff4cf;
        border-radius: 50%;
        box-shadow: 0 0 0.45rem #fff4cf;
        content: "";
        height: 0.24rem;
        position: absolute;
        right: 1rem;
        top: -0.06rem;
        width: 0.24rem;
      }

      .meteor.is-falling { animation: meteor-flight 1.1s ease-out; }

      button {
        appearance: none;
        background: transparent;
        border: 0;
        color: inherit;
        cursor: pointer;
        font: inherit;
        text-align: left;
        width: 100%;
      }

      .continue {
        align-items: center;
        background: linear-gradient(135deg, #f4be55, #e98550);
        background-position: 0% 0%;
        background-size: 170% 170%;
        border-radius: 1.28rem 0.68rem 1.35rem 0.72rem;
        color: #252039;
        display: grid;
        gap: 0.7rem;
        grid-template-columns: 2.8rem 1fr auto;
        padding: 1rem;
        transition: filter 180ms ease, transform var(--drift-duration, 9s) cubic-bezier(0.42, 0, 0.25, 1);
      }

      .continue:hover { filter: brightness(1.07); }

      .token {
        align-items: center;
        background: rgba(37, 32, 57, 0.16);
        border: 1px solid rgba(37, 32, 57, 0.14);
        border-radius: 0.7rem;
        display: flex;
        font-family: ui-monospace, monospace;
        font-size: 1.4rem;
        height: 2.8rem;
        justify-content: center;
      }

      .button-label { display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1rem; font-weight: 850; }
      .button-detail { display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.78rem; margin-top: 0.15rem; opacity: 0.76; }
      .arrow { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.5rem; }

      .section-title {
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.73rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin: 1.25rem 0 0.65rem;
        text-transform: uppercase;
      }

      .modes { display: grid; gap: 0.65rem; grid-template-columns: repeat(2, 1fr); }

      .mode {
        background-color: var(--panel-light);
        background-position: 10% 20%, 50% 50%;
        background-size: 170% 170%, 150% 150%;
        border: 1px solid var(--line);
        border-radius: 1.28rem 0.68rem 1.35rem 0.72rem;
        min-height: 8.4rem;
        padding: 1rem;
        position: relative;
        color: inherit;
        text-decoration: none;
        transition: border-color 180ms ease, transform var(--drift-duration, 9s) cubic-bezier(0.42, 0, 0.25, 1);
      }

      .mode:hover { border-color: rgba(116, 215, 196, 0.7); }
      .mode:first-child {
        background-image:
          radial-gradient(ellipse at 20% 22%, rgba(116, 215, 196, 0.26), transparent 54%),
          linear-gradient(135deg, #304565, #2b3855 58%, #26324d);
      }
      .mode:nth-child(2) {
        background-image:
          radial-gradient(ellipse at 78% 26%, rgba(236, 118, 93, 0.24), transparent 55%),
          linear-gradient(135deg, #3d3a5d, #363a59 55%, #29354d);
      }
      .mode-icon { color: var(--aqua); display: block; font-family: ui-monospace, monospace; font-size: 1.7rem; margin-bottom: 1.25rem; }
      .mode:nth-child(2) .mode-icon { color: var(--coral); }
      .mode strong { display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.92rem; }
      .mode span:last-child { color: var(--muted); display: block; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.72rem; margin-top: 0.25rem; }

      nav { display: flex; gap: 0.5rem; justify-content: center; }
      nav button, nav a { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.78rem; padding: 0.6rem; text-align: center; text-decoration: none; width: auto; }
      nav button:hover, nav a:hover { color: var(--ink); }

      @media (prefers-reduced-motion: no-preference) {
        .orb { animation: drift 9s ease-in-out infinite alternate; }
        .equation.left { animation: tilt 10s ease-in-out infinite alternate; }
        h1 { animation: title-color 22s ease-in-out infinite alternate; }
        .continue { animation: soften-corners 14s ease-in-out -3s infinite alternate, drift-gold 25s ease-in-out -8s infinite alternate; }
        .mode:first-child { animation: soften-corners 12s ease-in-out infinite alternate, drift-teal 23s ease-in-out infinite alternate; }
        .mode:nth-child(2) { animation: soften-corners 13s ease-in-out -4s infinite alternate, drift-coral 27s ease-in-out -6s infinite alternate; }
      }

      @keyframes drift { to { transform: rotate(13deg) translate(-1.2rem, 1rem) scale(1.08); } }
      @keyframes tilt { to { transform: rotate(-10deg) translateY(-0.8rem); } }
      @keyframes title-color {
        0% { color: #f4eddf; }
        52% { color: #eee0ed; }
        100% { color: #fae4c3; }
      }
      @keyframes soften-corners {
        to { border-radius: 0.68rem 1.38rem 0.72rem 1.42rem; }
      }
      @keyframes drift-teal {
        0%, 100% { background-position: 0% 0%, 50% 50%; }
        25% { background-position: 100% 0%, 65% 35%; }
        50% { background-position: 100% 100%, 50% 50%; }
        75% { background-position: 0% 100%, 35% 65%; }
      }
      @keyframes drift-coral {
        0%, 100% { background-position: 100% 0%, 50% 50%; }
        25% { background-position: 0% 0%, 35% 65%; }
        50% { background-position: 0% 100%, 50% 50%; }
        75% { background-position: 100% 100%, 65% 35%; }
      }
      @keyframes drift-gold {
        0%, 100% { background-position: 0% 0%; }
        25% { background-position: 100% 0%; }
        50% { background-position: 100% 100%; }
        75% { background-position: 0% 100%; }
      }
      @keyframes meteor-flight {
        0% { opacity: 0; transform: translate(0, 0) rotate(var(--meteor-angle)); }
        14% { opacity: 0.75; }
        100% { opacity: 0; transform: translate(var(--meteor-end-x), var(--meteor-end-y)) rotate(var(--meteor-angle)); }
      }

      @media (max-width: 370px) {
        main { margin: 1.5rem 0.8rem; }
        .panel { padding: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <div aria-hidden="true" class="background-lens">
      <span class="lens-number top">1 − 1</span>
      <span class="lens-number bottom">4 + 2</span>
    </div>
    <div aria-hidden="true" class="numbers top">1 − 1</div>
    <div aria-hidden="true" class="numbers bottom">4 + 2</div>
    <div aria-hidden="true" class="equation left">( 0 ) = 1</div>
    <div aria-hidden="true" class="equation right">∞ − 1</div>
    <div aria-hidden="true" class="orb"></div>
    <main>
      <header class="masthead">
        <p class="eyebrow">Dream arithmetic puzzle</p>
        <h1>NUMBERS<br />GAME</h1>
      </header>

      <section aria-label="Start game" class="panel">
        <span aria-hidden="true" class="meteor"></span>
        <button class="continue" type="button">
          <span aria-hidden="true" class="token">−1</span>
          <span><span class="button-label">Continue</span><span class="button-detail">Historical Date · 8 moves</span></span>
          <span aria-hidden="true" class="arrow">→</span>
        </button>

        <p class="section-title">Choose a new puzzle</p>
        <div class="modes">
          <a class="mode" href="one-non-zero.html">
            <span aria-hidden="true" class="mode-icon">1 → 0</span>
            <strong>One non-zero</strong>
            <span>Leave one number on the board</span>
          </a>
          <a class="mode" href="historical-date.html">
            <span aria-hidden="true" class="mode-icon">12·04·61</span>
            <strong>Historical Date</strong>
            <span>Rebuild a date from an event</span>
          </a>
        </div>
      </section>

      <nav aria-label="Secondary actions">
        <a href="how-to-play.html">How to play</a>
        <button type="button">Settings</button>
      </nav>
    </main>
    <script>
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function drift(card) {
        if (prefersReducedMotion.matches) return;

        const duration = 7000 + Math.random() * 6000;
        const x = (Math.random() - 0.5) * 10;
        const y = (Math.random() - 0.5) * 12;
        const rotation = (Math.random() - 0.5) * 0.7;
        card.style.setProperty('--drift-duration', `${duration}ms`);
        card.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rotation.toFixed(2)}deg)`;
        window.setTimeout(() => drift(card), duration + 400);
      }

      document.querySelectorAll('.continue, .mode').forEach((card, index) => {
        window.setTimeout(() => drift(card), 700 + index * 1600);
      });

      const meteor = document.querySelector('.meteor');
      const meteorRoutes = [
        () => ({
          left: '-8rem', top: `${14 + Math.random() * 62}%`,
          endX: '49rem', endY: `${6 + Math.random() * 13}rem`, angle: `${-31 + Math.random() * 14}deg`,
        }),
        () => ({
          left: 'calc(100% + 1rem)', top: `${14 + Math.random() * 62}%`,
          endX: '-49rem', endY: `${-19 + Math.random() * 13}rem`, angle: `${149 + Math.random() * 14}deg`,
        }),
        () => ({
          left: `${15 + Math.random() * 66}%`, top: '-1rem',
          endX: `${-12 + Math.random() * 24}rem`, endY: '20rem', angle: `${49 + Math.random() * 18}deg`,
        }),
        () => ({
          left: `${15 + Math.random() * 66}%`, top: 'calc(100% + 1rem)',
          endX: `${-12 + Math.random() * 24}rem`, endY: '-20rem', angle: `${-131 + Math.random() * 18}deg`,
        }),
      ];
      function scheduleMeteor(delay) {
        if (prefersReducedMotion.matches) return;
        window.setTimeout(() => {
          const route = meteorRoutes[Math.floor(Math.random() * meteorRoutes.length)]();
          meteor.style.setProperty('--meteor-left', route.left);
          meteor.style.setProperty('--meteor-top', route.top);
          meteor.style.setProperty('--meteor-end-x', route.endX);
          meteor.style.setProperty('--meteor-end-y', route.endY);
          meteor.style.setProperty('--meteor-angle', route.angle);
          meteor.classList.remove('is-falling');
          void meteor.offsetWidth;
          meteor.classList.add('is-falling');
          window.setTimeout(() => meteor.classList.remove('is-falling'), 1200);
          scheduleMeteor(35000 + Math.random() * 25000);
        }, delay);
      }
      scheduleMeteor(12000 + Math.random() * 10000);

      const lens = document.querySelector('.background-lens');
      function driftLens() {
        if (prefersReducedMotion.matches) return;

        const duration = 24000 + Math.random() * 20000;
        lens.style.setProperty('--lens-duration', `${duration}ms`);
        lens.style.left = `${4 + Math.random() * 74}vw`;
        lens.style.top = `${5 + Math.random() * 68}vh`;
        window.setTimeout(driftLens, duration + 500);
      }
      window.setTimeout(driftLens, 1800);
    </script>
  </body>
</html>
